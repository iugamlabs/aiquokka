name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tray:
    name: Tray ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: '0'}
          - {runner: ubuntu-latest, goos: linux, goarch: arm64, cgo: '0'}
          - {runner: macos-latest, goos: darwin, goarch: amd64, cgo: '1'}
          - {runner: macos-latest, goos: darwin, goarch: arm64, cgo: '1'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test tray on native host architecture
        run: go test -race -tags tray ./...
      - name: Package tray with licenses
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          AIQUOKKA_VERSION: ${{ github.ref_name }}
        run: scripts/build-tray.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tray/*.tar.gz
          if-no-files-found: error

  release:
    name: Build and publish release
    needs: tray
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - uses: actions/download-artifact@v4
        with:
          pattern: tray-*
          path: tray-dist
          merge-multiple: true
      - name: Verify tray packages and checksums
        run: |
          for target_os in linux macos; do
            for target_arch in amd64 arm64; do
              test -s "tray-dist/aiquokka-tray-$target_os-$target_arch.tar.gz"
            done
          done
          (cd tray-dist && sha256sum *.tar.gz > TRAY_SHA256SUMS)
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload tray packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" tray-dist/* --repo "$GITHUB_REPOSITORY" --clobber
